<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="tema-azul">

  <!-- Música de fundo (coloque o arquivo nostalgia.mp3 junto dos outros arquivos) -->
  <audio id="musica" src="nostalgia.mp3" loop preload="auto"></audio>
  <button class="botao" id="btn-musica" title="Música ligada/desligada">🎵</button>

  <!-- Janela de login / cadastro -->
  <div class="janela" id="login-win" style="left:50%;top:50%;transform:translate(-50%,-50%);width:290px">
    <div class="titulo"><span id="login-titulo">Entrar - BIM</span></div>
    <div class="corpo login-corpo">
      <div class="marca">
        <div class="marca-icone">💬</div>
        <div class="marca-nome">B<span>I</span>M</div>
        <div class="marca-sub">Mensageiro Instantâneo</div>
      </div>

      <label for="f-user">Nome de usuário</label>
      <input class="entrada" type="text" id="f-user" maxlength="16" autocomplete="username" spellcheck="false">

      <label for="f-pass">Senha</label>
      <input class="entrada" type="password" id="f-pass" autocomplete="current-password">

      <div id="linha-confirma" class="escondido">
        <label for="f-pass2">Confirmar senha</label>
        <input class="entrada" type="password" id="f-pass2" autocomplete="new-password">
      </div>

      <div id="linha-codigo" class="escondido">
        <label for="f-codigo">Código de administrador</label>
        <input class="entrada" type="password" id="f-codigo" autocomplete="off">
      </div>

      <div class="botoes-login">
        <button class="botao" id="btn-principal">Entrar</button>
      </div>
      <div class="troca">
        <a href="#" id="link-troca">Não tem um nome? Cadastre-se grátis!</a>
      </div>
      <div class="status-login" id="status-login"></div>
    </div>
  </div>

  <!-- Lista de amigos -->
  <div class="janela escondido" id="lista-win" style="left:30px;top:30px;width:270px;height:540px">
    <div class="titulo"><span id="lista-titulo">Lista de Amigos</span></div>
    <div class="corpo lista-corpo">
      <div class="menubar"><span>Pessoas</span><span>Ver</span><span>Ajuda</span></div>
      <div class="perfil">
        <div class="avatar" id="meu-avatar">🙂</div>
        <div class="perfil-info">
          <strong id="meu-nome"></strong><br>
          <small id="meu-estado">Disponível</small>
          <small id="minha-bio" class="bio"></small>
        </div>
      </div>
      <div class="amigos entrada-inset" id="amigos"></div>
      <div class="lista-botoes lista-acoes">
        <button class="botao" id="btn-ver" title="Ver perfil do amigo selecionado">👁 Perfil</button>
        <button class="botao" id="btn-bloq" title="Bloquear o amigo selecionado">🚫 Bloquear</button>
        <button class="botao" id="btn-denun" title="Denunciar o amigo selecionado">🚩 Denunciar</button>
        <button class="botao" id="btn-del" title="Remover amigo selecionado">➖ Remover</button>
      </div>
      <div class="lista-botoes">
        <button class="botao" id="btn-add" title="Enviar pedido de amizade">➕ Adicionar</button>
        <button class="botao" id="btn-pedidos" title="Pedidos de amizade">📨 Pedidos</button>
        <button class="botao" id="btn-perfil" title="Editar meu perfil">👤 Meu perfil</button>
        <button class="botao" id="btn-away">🌙 Ausente</button>
        <button class="botao" id="btn-som">🔊</button>
        <button class="botao escondido" id="btn-denuncias">🛡 Denúncias</button>
        <button class="botao" id="btn-sair">Sair</button>
      </div>
    </div>
  </div>

  <div id="janelas-chat"></div>

  <script src="script.js"></script>
</body>
</html>
